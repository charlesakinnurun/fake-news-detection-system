[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-detection"
version = "0.1.0"
description = "Leakage-aware fake news classification system with a reproducible training pipeline, FastAPI service and Streamlit UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fake News Detection contributors" }]
keywords = ["nlp", "machine-learning", "fake-news", "text-classification", "mlops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
app = [
    "streamlit>=1.31",
    "requests>=2.31",
]
train = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.9",
]
transformer = [
    "torch>=2.2",
    "transformers>=4.40",
]

[project.urls]
Repository = "https://github.com/example/fake-news-detection"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fake_news_detection = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = [
    "E501",  # long lines are handled by the formatter / review
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "N803",  # scikit-learn's transformer API uses X (capital) by convention
    "N806",  # the sklearn/Starlette convention for class-like local names
    "N818",  # exception naming convention
    # The corpus and the docs intentionally contain typographic quotes, dashes
    # and full-width characters (Unicode normalisation is a tested feature).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "RUF012"]
"notebooks/*" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["fake_news_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises the FastAPI application end to end",
    "slow: long-running tests (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["fake_news_detection"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
