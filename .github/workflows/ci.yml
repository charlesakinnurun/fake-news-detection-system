name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api,app,train]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type-check
        run: python -m mypy src

      - name: Run the test suite
        run: python -m pytest --cov=fake_news_detection --cov-report=term-missing

      - name: Compile the package and scripts
        run: python -m compileall -q src app scripts

  startup-smoke:
    name: API startup smoke test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]"

      - name: Start the API without artifacts
        run: |
          python -m uvicorn fake_news_detection.api.main:app --host 127.0.0.1 --port 8000 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          # Liveness must succeed; readiness must report 503 when no model is
          # mounted, which is the documented deployment contract.
          curl --silent --fail http://127.0.0.1:8000/health
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8000/ready)
          test "$status" = "503"
